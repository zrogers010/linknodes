services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=8080
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      - PORT=80
    ports:
      - "8080:80"
    depends_on:
      - backend
