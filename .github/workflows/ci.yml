name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Start backend server
        run: |
          cd backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8100 &
          sleep 5
          curl -f http://127.0.0.1:8100/healthz || exit 1
      
      - name: Run backend integration tests
        run: |
          cd backend
          python test_backend.py
      
      - name: Stop backend server
        if: always()
        run: |
          pkill -f "uvicorn main:app" || true

  validate-ccip:
    name: Validate CCIP Registry
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install web3
        run: pip install web3
      
      - name: Validate CCIP registry structure
        run: |
          cd backend
          python validate_ccip_registry.py
      
      - name: Verify CCIP data matches official API (manual check)
        run: |
          echo "⚠️  Skipping live API verification in CI (network-dependent)"
          echo "Run 'python backend/verify_ccip_data.py' manually to verify"

  compile-snippets:
    name: Compile Solidity Snippets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Verify forge installation
        run: |
          forge --version
          # Foundry's solc is via: forge build (not standalone solc)
      
      - name: Install Solidity dependencies
        run: |
          cd backend
          npm install --no-save --legacy-peer-deps @chainlink/contracts@1.2.0 @chainlink/contracts-ccip@2.0.0 @openzeppelin/contracts
      
      - name: Compile Solidity snippets with forge
        run: |
          cd backend
          python validate_snippets_forge.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Verify sitemap
        run: |
          cd frontend
          # Check that sitemap exists and has content
          test -f public/sitemap.xml
          # Count CCIP lanes in sitemap
          LANE_COUNT=$(grep -c "ccip/" public/sitemap.xml || true)
          echo "Sitemap contains $LANE_COUNT CCIP lanes"
          # Count feed pages in sitemap
          FEED_COUNT=$(grep -c "/feeds/" public/sitemap.xml || true)
          echo "Sitemap contains $FEED_COUNT feed pages"
          # Should have ~49 CCIP lanes
          if [ "$LANE_COUNT" -lt 40 ]; then
            echo "❌ Too few CCIP lanes in sitemap (expected ~49)"
            exit 1
          fi
          # Should have ~1400+ feed pages
          if [ "$FEED_COUNT" -lt 1400 ]; then
            echo "❌ Too few feed pages in sitemap (expected ~1400+)"
            exit 1
          fi
          echo "✅ Sitemap looks good: $LANE_COUNT CCIP lanes, $FEED_COUNT feed pages"

      - name: Verify OG image
        run: |
          cd frontend
          test -f public/og-default.png
          echo "✅ OG image generated"

      - name: Verify prerendered files exist
        run: |
          cd frontend/dist
          # Check key prerendered files
          test -f feeds/ethereum/eth-usd/index.html || { echo "❌ Missing feeds/ethereum/eth-usd/index.html"; exit 1; }
          test -f feeds/base/index.html || { echo "❌ Missing feeds/base/index.html"; exit 1; }
          test -f products/ccip/ethereum/arbitrum/index.html || { echo "❌ Missing products/ccip/ethereum/arbitrum/index.html"; exit 1; }
          test -f 404.html || { echo "❌ Missing 404.html"; exit 1; }
          echo "✅ Prerendered files exist"

  seo-nginx-tests:
    name: SEO & 404 Tests (with Nginx)
    runs-on: ubuntu-latest
    needs: frontend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Start nginx with built files
        run: |
          # Use nginx Docker container with our config
          docker run -d \
            --name test-nginx \
            -p 8080:80 \
            -v "$(pwd)/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$(pwd)/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine
          
          # Wait for nginx to start
          sleep 3
          
          # Check if nginx is actually running
          if ! docker ps | grep -q test-nginx; then
            echo "❌ Nginx container exited"
            docker logs test-nginx
            exit 1
          fi
          
          # Verify nginx is serving content
          if ! curl -f http://localhost:8080/ > /dev/null 2>&1; then
            echo "❌ Nginx failed to respond"
            docker logs test-nginx
            exit 1
          fi
          
          echo "✅ Nginx started"
      
      - name: Test valid routes return 200 with unique meta tags
        run: |
          echo "Testing valid routes..."
          
          # Test ethereum eth-usd feed
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/feeds/ethereum/eth-usd)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          HTML=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /feeds/ethereum/eth-usd returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          
          if ! echo "$HTML" | grep -q "<title>ETH / USD on Ethereum"; then
            echo "❌ /feeds/ethereum/eth-usd missing correct title"
            echo "$HTML" | grep "<title>"
            exit 1
          fi
          
          if ! echo "$HTML" | grep -q 'rel="canonical" href="https://www.linknodes.io/feeds/ethereum/eth-usd"'; then
            echo "❌ /feeds/ethereum/eth-usd missing correct canonical"
            exit 1
          fi
          
          echo "✅ /feeds/ethereum/eth-usd: 200 with correct meta tags"
          
          # Test base feed index
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/feeds/base)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          HTML=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /feeds/base returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          
          if ! echo "$HTML" | grep -q "<title>Base Data Feeds"; then
            echo "❌ /feeds/base missing correct title"
            exit 1
          fi
          
          echo "✅ /feeds/base: 200 with correct meta tags"
          
          # Test CCIP lane
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/products/ccip/ethereum/arbitrum)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          HTML=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /products/ccip/ethereum/arbitrum returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          
          if ! echo "$HTML" | grep -q "<title>Ethereum Mainnet → Arbitrum One CCIP Lane"; then
            echo "❌ /products/ccip/ethereum/arbitrum missing correct title"
            exit 1
          fi
          
          echo "✅ /products/ccip/ethereum/arbitrum: 200 with correct meta tags"
      
      - name: Test invalid routes return 404
        run: |
          echo "Testing invalid routes..."
          
          # Test non-existent feed
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/feeds/ethereum/not-a-feed)
          if [ "$HTTP_CODE" != "404" ]; then
            echo "❌ /feeds/ethereum/not-a-feed returned $HTTP_CODE (expected 404)"
            exit 1
          fi
          echo "✅ /feeds/ethereum/not-a-feed: 404"
          
          # Test unsupported CCIP lane (ethereum -> zksync not supported)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/products/ccip/ethereum/zksync)
          if [ "$HTTP_CODE" != "404" ]; then
            echo "❌ /products/ccip/ethereum/zksync returned $HTTP_CODE (expected 404)"
            exit 1
          fi
          echo "✅ /products/ccip/ethereum/zksync: 404"
          
          # Test random invalid path
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/nope)
          if [ "$HTTP_CODE" != "404" ]; then
            echo "❌ /nope returned $HTTP_CODE (expected 404)"
            exit 1
          fi
          echo "✅ /nope: 404"
          
          echo ""
          echo "✅ All 404 tests passed"
      
      - name: Verify OG image URLs are absolute
        run: |
          echo "Checking OG image URLs..."
          HTML=$(curl -s http://localhost:8080/)
          
          if ! echo "$HTML" | grep -q 'property="og:image" content="https://www.linknodes.io/og-default.png"'; then
            echo "❌ OG image URL is not absolute"
            echo "$HTML" | grep 'og:image'
            exit 1
          fi
          
          echo "✅ OG image URL is absolute"
      
      - name: Stop nginx
        if: always()
        run: |
          docker stop test-nginx || true
          docker rm test-nginx || true

  check-registry-sync:
    name: Check Registry Data Sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Check registry sync
        run: |
          cd frontend
          node check-registry-sync.js

  docker-build-frontend:
    name: Docker Build - Frontend
    runs-on: ubuntu-latest
    needs: check-registry-sync
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build frontend Docker image (production-style)
        run: |
          # Build exactly as production does: context=frontend/, VITE_API_BASE_URL empty
          docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL= -t linknodes-frontend:test frontend
      
      - name: Run frontend container
        run: |
          # PORT env var defaults to 8080 in Dockerfile, nginx listens on that
          docker run -d --name test-frontend -p 8080:8080 linknodes-frontend:test
          sleep 5
          
          # Verify container is running
          if ! docker ps | grep -q test-frontend; then
            echo "❌ Frontend container exited"
            docker logs test-frontend
            exit 1
          fi
          
          # Check if nginx is listening
          if ! docker exec test-frontend netstat -tlnp | grep -q ':8080'; then
            echo "❌ Nginx is not listening on port 8080"
            docker logs test-frontend
            exit 1
          fi
          
          echo "✅ Frontend container started"
      
      - name: Test prerendered routes
        run: |
          echo "Testing prerendered routes in Docker image..."
          
          # Test eth-usd feed
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/feeds/ethereum/eth-usd)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          HTML=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /feeds/ethereum/eth-usd returned $HTTP_CODE"
            exit 1
          fi
          
          if ! echo "$HTML" | grep -q "<title>ETH / USD on Ethereum"; then
            echo "❌ Missing correct title"
            exit 1
          fi
          
          echo "✅ /feeds/ethereum/eth-usd works"
          
          # Test 404
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/nope)
          if [ "$HTTP_CODE" != "404" ]; then
            echo "❌ /nope returned $HTTP_CODE (expected 404)"
            exit 1
          fi
          
          echo "✅ 404 works"
          echo ""
          echo "✅ Docker image works correctly"
      
      - name: Stop container
        if: always()
        run: |
          docker stop test-frontend || true
          docker rm test-frontend || true

  docker-build-backend:
    name: Docker Build - Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build backend Docker image (production-style)
        run: |
          # Build exactly as production does: context=backend/
          docker build -f backend/Dockerfile -t linknodes-backend:test backend
      
      - name: Run backend container
        run: |
          docker run -d --name test-backend -p 8080:8080 linknodes-backend:test
          sleep 5
          
          # Verify container is running
          if ! docker ps | grep -q test-backend; then
            echo "❌ Backend container exited"
            docker logs test-backend
            exit 1
          fi
          
          echo "✅ Backend container started"
          echo "Container logs:"
          docker logs test-backend
      
      - name: Test backend API
        run: |
          echo "Testing backend API..."
          
          # Test healthz
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /healthz returned $HTTP_CODE"
            echo "Container logs:"
            docker logs test-backend
            exit 1
          fi
          echo "✅ /healthz works"
          
          # Test registry endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/registry)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /v1/registry returned $HTTP_CODE"
            exit 1
          fi
          echo "✅ /v1/registry works"
          
          # Test feed query
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/query/ethereum/eth-usd)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ /v1/query/ethereum/eth-usd returned $HTTP_CODE"
            exit 1
          fi
          echo "✅ /v1/query works"
          
          echo ""
          echo "✅ Backend Docker image works correctly"
      
      - name: Stop container
        if: always()
        run: |
          docker stop test-backend || true
          docker rm test-backend || true

