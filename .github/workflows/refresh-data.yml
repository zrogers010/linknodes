name: Refresh Data

on:
  schedule:
    - cron: '17 13 * * *'  # Daily at 13:17 UTC (06:17 PDT / 05:17 PST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%F)" >> $GITHUB_OUTPUT
      
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run data builders
        id: build
        run: |
          cd backend
          python3 build_registry.py
          python3 build_operators.py
          python3 build_ccip_registry.py
          python3 build_agents_catalog.py
      
      - name: Sync frontend registry data
        run: |
          cd frontend
          node sync-registry-data.js
      
      - name: Run shape validation tests
        run: |
          cd backend
          python3 -m pytest test_shape_validation.py test_refresh_checks.py test_operators.py test_agents_catalog.py -v
      
      - name: Check for changes
        id: check_changes
        run: |
          cd backend
          set +e
          python3 check_data_changes.py
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ $rc -eq 10 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Error: check_data_changes.py failed with exit code $rc"
            exit $rc
          fi
      
      - name: Generate diff summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: diff_summary
        run: |
          cd backend
          python3 generate_refresh_diff.py > /tmp/diff_summary.md
          cat /tmp/diff_summary.md >> $GITHUB_STEP_SUMMARY
      
      - name: Commit and push to rolling branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="data/refresh"
          
          # Always create/reset branch from current HEAD (main), not from remote
          # This ensures we rebuild from fresh main every day
          git checkout -B "$BRANCH_NAME"
          
          # Stage and commit changes
          git add -A
          git commit -m "Data refresh ${{ steps.date.outputs.date }}"
          
          # Force push to update the rolling branch
          git push -f origin "$BRANCH_NAME"
      
      - name: Create or update rolling PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="data/refresh"
          TITLE="Data refresh (rolling, last updated ${{ steps.date.outputs.date }})"
          
          # Read diff summary
          DIFF_SUMMARY=$(cat /tmp/diff_summary.md)
          
          # Build PR body
          PR_BODY="Automated data refresh from reference-data-directory and on-chain sources.

          This is a rolling PR that gets updated daily with the latest data changes.

          **Last updated:** ${{ steps.date.outputs.date }}

          $DIFF_SUMMARY

          **Review checklist:**
          - [ ] Mapping rates look reasonable
          - [ ] No unexpected operator changes
          - [ ] Feed count changes are expected

          **CI Status:** CI checks are dispatched to the refresh branch after each update. Note: This requires ci.yml with workflow_dispatch to be on main (works after merge).

          ---
          *This PR is automatically updated by the refresh-data workflow.*"
          
          # Check if PR exists from this branch
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' || echo "")
          
          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #$PR_NUMBER"
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$PR_BODY"
          else
            echo "Creating new PR"
            gh pr create \
              --head "$BRANCH_NAME" \
              --base main \
              --title "$TITLE" \
              --body "$PR_BODY" \
              --label "data-refresh"
          fi
      
      - name: Dispatch CI workflow on refresh branch
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="data/refresh"
          echo "Dispatching CI workflow to run on $BRANCH_NAME"
          gh workflow run ci.yml --ref "$BRANCH_NAME"
